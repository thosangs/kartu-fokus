# Deploy otomatis ke Cloudflare Workers (fokus-anak.tukangdata.com) setiap ada push ke main.
# Butuh dua secret di repo GitHub: CLOUDFLARE_API_TOKEN dan CLOUDFLARE_ACCOUNT_ID.
# Secret GEMINI_API_KEY tetap tersimpan di Worker dan tidak ikut diubah oleh deploy ini.
name: Deploy ke Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# Kalau ada dua push berdekatan, cukup deploy yang terbaru.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cek secret Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN belum diisi. Tambahkan di Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Deploy dengan wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
